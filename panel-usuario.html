<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="img/canchalibre-icon.svg?v=1">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.card-body > div { min-width: 0; overflow-wrap: anywhere; }</style>
    <script src="config.js"></script>
  <link rel="stylesheet" href="css/panels.css">
</head>
<body class="bg-light panel-ui">
<a href="#contenido-principal" class="skip-link">Ir al contenido</a>
<nav class="panel-brand" aria-label="CanchaLibre"><a href="index.html">CanchaLibre</a><span>Tu espacio de gestión</span></nav>

    
<div class="container my-4" id="contenido-principal" tabindex="-1">
    <h1>Mi cuenta</h1>
    <p id="info-usuario"></p>
    <div class="d-flex gap-2 mb-3">
        <div class="d-flex gap-2 mb-3">
            <button id="cerrar-sesion" class="btn btn-danger">Cerrar sesión</button>
            <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
        </div>
        
        
</div>
<h2>Mis datos</h2>
<form id="form-usuario" class="mb-4">
    <div class="mb-2">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" class="form-control" required disabled>
    </div>
    <div class="mb-2">
        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" class="form-control" required disabled>
    </div>
    <div class="mb-2">
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" class="form-control" required disabled>
    </div>
    <div class="mb-2">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" class="form-control" disabled>
    </div>

    <!-- Botones -->
    <button type="button" id="btn-editar" class="btn btn-outline-secondary">
        Modificar datos
    </button>
    <button type="submit" id="btn-guardar" class="btn btn-primary" style="display:none;">
        Guardar cambios
    </button>
</form>


    <h2>Mis reservas</h2>
    <div id="reservas-container" aria-live="polite" aria-busy="true">
        <p>Cargando reservas...</p>
       </div>
    
</div>

<script src="js/auth.js"></script>
<script src="js/panel-usuario.js"></script>
<script src="js/footer.js"></script>


</body>
</html>
