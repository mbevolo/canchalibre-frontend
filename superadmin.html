<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="img/canchalibre-icon.svg?v=1">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script src="config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - CanchaLibre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/brand.css">
</head>
<body class="panel-ui cl-theme cl-panel">
<a href="#contenido-principal" class="skip-link">Ir al contenido</a>
  <nav class="navbar navbar-dark bg-dark panel-brand" aria-label="Administración">
    <a class="cl-brand" href="index.html" aria-label="CanchaLibre, inicio"><img src="img/canchalibre-logo.svg" width="255" height="48" alt="CanchaLibre"></a><span class="cl-admin-label">Administración</span>
    <button class="btn btn-danger" id="cerrar-sesion">Cerrar sesión</button>
  </nav>
  <div class="container mt-4" id="contenido-principal" tabindex="-1">
    <div class="row">
      <div class="col-12 col-md-3">
        <div class="list-group" id="menu-superadmin">
          <button class="list-group-item list-group-item-action active" data-section="dashboard">Dashboard</button>
          <button class="list-group-item list-group-item-action" data-section="clubes">Clubes</button>
          <button class="list-group-item list-group-item-action" data-section="usuarios">Usuarios</button>
          <button class="list-group-item list-group-item-action" data-section="reservas">Reservas</button>
          <button class="list-group-item list-group-item-action" data-section="pagos">Pagos y Finanzas</button>
          <button class="list-group-item list-group-item-action" data-section="destacados">Destacados</button>
          <button class="list-group-item list-group-item-action" data-section="config">Configuraciones</button>
        </div>
      </div>
      <div class="col-12 col-md-9">
        <div id="superadmin-content">
          <!-- Acá se carga cada sección con JS -->
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/superadmin.js"></script>
  <script src="js/footer.js"></script>

</body>
</html>
