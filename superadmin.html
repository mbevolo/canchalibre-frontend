<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="img/canchalibre-icon.svg?v=1">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script src="config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - CanchaLibre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/superadmin.css">
</head>
<body class="panel-ui cl-theme cl-panel admin-app">
<a href="#contenido-principal" class="skip-link">Ir al contenido</a>
  <nav class="navbar navbar-dark bg-dark panel-brand" aria-label="Administración">
    <a class="cl-brand" href="index.html" aria-label="CanchaLibre, inicio"><img src="img/canchalibre-logo.svg" width="255" height="48" alt="CanchaLibre"></a><span class="cl-admin-label">Administración</span>
    <button class="btn btn-danger" id="cerrar-sesion">Cerrar sesión</button>
  </nav>
  <main class="admin-layout" id="contenido-principal" tabindex="-1">
    <aside class="admin-sidebar" aria-label="Secciones del panel">
      <p class="admin-nav-label">GESTIÓN DE LA PLATAFORMA</p>
      <div class="list-group" id="menu-superadmin">
        <button class="list-group-item active" data-section="dashboard" aria-current="page">Resumen</button>
        <button class="list-group-item" data-section="clubes">Clubes</button>
        <button class="list-group-item" data-section="usuarios">Usuarios</button>
        <button class="list-group-item" data-section="reservas">Reservas</button>
        <button class="list-group-item" data-section="pagos">Cobros y pagos</button>
        <button class="list-group-item" data-section="destacados">Clubes destacados</button>
        <button class="list-group-item" data-section="config">Precio de destacados</button>
        <button class="list-group-item" data-section="mercadopago">MercadoPago</button>
      </div>
      <p class="admin-sidebar-note">Administrá clubes, reservas y los cobros de CanchaLibre.</p>
    </aside>
    <section class="admin-workspace" aria-label="Contenido de la sección">
      <div id="superadmin-content" aria-live="polite"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/superadmin.js"></script>
  <script src="js/footer.js"></script>

</body>
</html>
