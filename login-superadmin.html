<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="img/canchalibre-icon.svg?v=1">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script src="config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de administración</title>
  <link href="css/style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/brand.css">
</head>
<body class="cl-theme cl-auth">
<header class="cl-header"><a class="cl-brand" href="index.html" aria-label="CanchaLibre, inicio"><img src="img/canchalibre-logo.svg" width="255" height="48" alt="CanchaLibre"></a><a class="cl-back" href="index.html">Volver al buscador</a></header>
<main class="cl-page">
  <div class="container mt-5" style="max-width:400px;">
    <h2 class="mb-4">Acceso de administración</h2>
    <div id="alerta" role="status" aria-live="polite"></div>
    <form id="form-admin-login">
    <label for="email">Correo electrónico</label>
    <input required autocomplete="email" id="email" type="email" class="form-control mb-2" placeholder="Email">
    <label for="password">Contraseña</label>
    <input required autocomplete="current-password" id="password" type="password" class="form-control mb-2" placeholder="Contraseña">
    <button type="submit" id="btnLogin" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
  <script>
    document.getElementById('form-admin-login').addEventListener('submit', async e => {
      e.preventDefault();
      const button = document.getElementById('btnLogin');
      if (button.disabled) return;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alerta = document.getElementById('alerta');
      alerta.textContent = 'Ingresando…';
      button.disabled = true;
      try {
        const res = await fetch(window.CanchaLibreApiUrl('/superadmin/login'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          localStorage.setItem('superadminToken', data.token);
          window.location.href = 'superadmin.html';
        } else { alerta.className = 'alert alert-danger'; alerta.textContent = data.msg || 'No se pudo iniciar sesión.'; }
      } catch (_) { alerta.className = 'alert alert-danger'; alerta.textContent = 'Error de conexión. Intentá nuevamente.'; }
      finally { button.disabled = false; }
    });
  </script>
  </main>
<script src="js/footer.js"></script>

</body>
</html>
