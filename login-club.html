<!DOCTYPE html>
<html lang="es">
<head>
  <script src="config.js"></script>
    <meta charset="UTF-8">
    <title>Login Club</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Acceso de Club</h1>

    <form id="form-login-club">
        <input type="email" id="email" placeholder="Correo electrónico" required><br>
        <input type="password" id="password" placeholder="Contraseña" required><br>
        <button type="submit">Iniciar sesión</button>
    </form>
<div class="text-center mt-3">
  <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
</div>

  <!-- 🔽 Bloque oculto para reenviar verificación (solo se muestra si el backend dice que no está verificado) -->
  <div id="bloque-reenvio-verificacion" style="display:none; margin-top: 16px; text-align:left;">
    <p style="font-size:0.95rem; margin-bottom:8px;">
      Tu cuenta de club todavía no está verificada.<br>
      Podés reenviar el mail de verificación al correo que ingresaste.
    </p>
    <button id="btn-reenviar-verificacion" style="padding:8px 12px; border:none; border-radius:6px; background:#2c7be5; color:#fff; cursor:pointer;">
      Reenviar mail de verificación
    </button>
    <div id="mensaje-reenvio" style="margin-top:8px; font-size:0.9rem;"></div>
  </div>


    <p>¿Todavía no estás registrado? <a href="registro-club.html">Registrate</a></p>

    <!-- IMPORTANTE: aquí va el script -->
    <script src="js/login-club.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const verified = params.get('verified');

    if (verified === '1') {
      const div = document.createElement('div');
      div.className = 'alert alert-success text-center mt-3';
      div.innerHTML = '✅ Tu cuenta fue verificada correctamente. Ya podés iniciar sesión.';
      document.body.prepend(div);
    }
  });
</script>
<script src="js/footer.js"></script>

</body>
</html>
