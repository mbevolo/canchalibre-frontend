<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="img/canchalibre-icon.svg?v=1">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Club · CanchaLibre</title>
    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/brand.css">
</head>
<body class="cl-theme cl-auth">
<header class="cl-header"><a class="cl-brand" href="index.html" aria-label="CanchaLibre, inicio"><img src="img/canchalibre-logo.svg" width="255" height="48" alt="CanchaLibre"></a><a class="cl-back" href="index.html">Volver al buscador</a></header>
<main class="cl-page">
    <h1>Acceso de Club</h1>

    <form id="form-login-club">
        <label for="email">Correo electrónico</label><br>
        <input autocomplete="email" type="email" id="email" placeholder="Correo electrónico" required><br>
        <label for="password">Contraseña</label><br>
        <input autocomplete="current-password" type="password" id="password" placeholder="Contraseña" required><br>
        <button type="submit">Iniciar sesión</button>
    </form>
<div class="text-center mt-3">
  <a href="recuperar.html?tipo=club">¿Olvidaste tu contraseña?</a>
</div>

  <!-- 🔽 Bloque oculto para reenviar verificación (solo se muestra si el backend dice que no está verificado) -->
  <div id="bloque-reenvio-verificacion" style="display:none; margin-top: 16px; text-align:left;">
    <p style="font-size:0.95rem; margin-bottom:8px;">
      Tu cuenta de club todavía no está verificada.<br>
      Podés reenviar el mail de verificación al correo que ingresaste.
    </p>
    <button id="btn-reenviar-verificacion" style="padding:8px 12px; border:none; border-radius:6px; background:#2c7be5; color:#fff; cursor:pointer;">
      Reenviar mail de verificación
    </button>
    <div id="mensaje-reenvio" style="margin-top:8px; font-size:0.9rem;"></div>
  </div>


    <p>¿Todavía no estás registrado? <a href="registro-club.html">Registrate</a></p>

    <!-- IMPORTANTE: aquí va el script -->
    <script src="js/login-club.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const verified = params.get('verified');

    if (verified === '1') {
      const div = document.createElement('div');
      div.className = 'alert alert-success text-center mt-3';
      div.innerHTML = '✅ Tu cuenta fue verificada correctamente. Ya podés iniciar sesión.';
      document.body.prepend(div);
    }
  });
</script>
</main>
<script src="js/footer.js"></script>

</body>
</html>
