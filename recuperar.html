<!DOCTYPE html>
<html lang="es">
<head>
  <script src="config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - CanchaLibre</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-body">
            <h3 class="text-center mb-4">Recuperar contraseña</h3>
            <p class="text-muted text-center">Ingresá tu correo electrónico para recibir un enlace de recuperación.</p>

            <form id="formRecuperar">
              <div class="mb-3"><label for="tipo-cuenta" class="form-label">Tipo de cuenta</label>
              <select id="tipo-cuenta" class="form-select"><option value="usuario">Usuario</option><option value="club">Club</option></select></div>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Enviar enlace</button>
              </div>
            </form>

            <div id="mensaje" class="mt-3 text-center" role="status" aria-live="polite"></div>

            <div class="text-center mt-3">
              <a href="login.html">Volver al inicio de sesión</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('tipo-cuenta').value = new URLSearchParams(location.search).get('tipo') === 'club' ? 'club' : 'usuario';
    document.getElementById('formRecuperar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = e.currentTarget.querySelector('button[type=submit]');
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = 'Enviando…';
      const email = document.getElementById('email').value.trim();
      const mensajeDiv = document.getElementById('mensaje');
      mensajeDiv.textContent = 'Enviando...';

      try {
        const endpoint = document.getElementById('tipo-cuenta').value === 'club' ? '/recuperar-club' : '/recuperar';
        const res = await fetch(window.CanchaLibreApiUrl('') + endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (res.ok) {
          mensajeDiv.className = 'mt-3 text-success'; mensajeDiv.textContent = data.mensaje;
        } else {
          mensajeDiv.className = 'mt-3 text-danger'; mensajeDiv.textContent = data.error || 'Error al enviar el correo.';
        }
      } catch (error) {
        mensajeDiv.className = 'mt-3 text-danger'; mensajeDiv.textContent = 'Error de conexión. Intentá nuevamente.';
      } finally { button.disabled = false; button.textContent = 'Enviar enlace'; }
    });
  </script>
  <script src="js/footer.js"></script>

</body>
</html>
