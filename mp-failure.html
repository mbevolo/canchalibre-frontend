<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago rechazado - CanchaLibre</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f8f9fa;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
    .card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);max-width:420px;width:92%;text-align:center}
    h2{color:#dc3545;margin:0 0 10px}
    p{color:#333}
    a.btn{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:8px;background:#2c7be5;color:#fff;text-decoration:none}
    .muted{color:#666;font-size:13px;margin-top:10px}
  </style>
</head>
<body>
  <div class="card">
    <h2>❌ Pago no completado</h2>
    <p>El pago fue rechazado o cancelado.</p>
    <p id="turno"></p>
    <a class="btn" href="index.html">Volver al buscador</a>
    <div class="muted">Podés intentar nuevamente desde el panel del club con “Generar link de pago”.</div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const turnoId = params.get('turno');
    if (turnoId) document.getElementById('turno').innerText = `Turno: ${turnoId}`;
  </script>
</body>
</html>
